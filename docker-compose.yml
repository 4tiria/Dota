version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  rabbitmq:
      image: rabbitmq:management
      container_name: rabbitmq
      ports:
        - "5672:5672"
        - "15672:15672"
      environment:
        - RABBITMQ_DEFAULT_USER=guest
        - RABBITMQ_DEFAULT_PASS=guest

  api:
    build:
      context: .
      dockerfile: Dota.API/Dockerfile
    container_name: api      
    ports:
      - "5000:8080"
    environment:
      - MongoDB__ConnectionURI=mongodb://mongodb:27017?connectTimeoutMS=3000&serverSelectionTimeoutMS=3000
      - MongoDB__DatabaseName=dota
    depends_on:
      - mongodb
      - rabbitmq

  auth:
    build:
      context: .
      dockerfile: Dota.Auth/Dockerfile
    container_name: auth
    ports:
      - "5001:8080"
    environment:
      - MongoDB__ConnectionURI=mongodb://mongodb:27017?connectTimeoutMS=3000&serverSelectionTimeoutMS=3000
      - MongoDB__DatabaseName=dota-auth
    depends_on:
      - mongodb

  frontend:
      build:
        context: ./front
        dockerfile: Dockerfile 
      container_name: front
      volumes:
        - ./front:/app
      ports:
        - "3000:3000"
volumes:
  mongo-data:
